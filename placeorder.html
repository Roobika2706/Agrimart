<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Local Market Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    input {
      margin: 8px;
      padding: 8px;
      font-size: 16px;
      width: 250px;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>Welcome, Local Market!</h2>

  <form onsubmit="sendOrder(event)">
    <input type="text" id="username" placeholder="Enter your name" required><br>
    <input type="text" id="product" placeholder="Enter product name" required><br>
    <input type="number" id="quantity" placeholder="Enter quantity" required><br>
    <button type="submit">Send Order</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
