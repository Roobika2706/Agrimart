<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    h1 { text-align: center; }
    .form-container { background: #fff; padding: 20px; margin: auto; width: 400px;
      border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    input, select, button { width: 100%; padding: 10px; margin: 8px 0;
      border: 1px solid #ccc; border-radius: 6px; }
    button { background: #4CAF50; color: white; border: none; cursor: pointer; }
    button:hover { background: #45a049; }
    .message { margin-top: 10px; font-weight: bold; color: green; }
  </style>
</head>
<body>
  <h1>Admin Dashboard</h1>
  <div class="form-container">
    <h2>Add New User</h2>
    <form id="addUserForm">
      <input type="email" id="email" placeholder="User Email" required>
      <input type="password" id="password" placeholder="User Password" required>
      <select id="role" required>
        <option value="">--Select Role--</option>
        <option value="farmer">Farmer</option>
        <option value="market">Market</option>
      </select>
      <button type="submit">Add User</button>
    </form>
    <div class="message" id="message"></div>
  </div>

  <script>
    document.getElementById("addUserForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const role = document.getElementById("role").value;

      const res = await fetch("http://localhost:5000/api/users", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password, role })
      });

      const data = await res.json();
      document.getElementById("message").textContent = data.message;
    });
  </script>
</body>
</html>
